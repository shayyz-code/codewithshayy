name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes to the repository, and this is a public repo where any fork
# can open a pull request. Read-only by default rather than whatever the org or
# repo setting happens to be.
permissions:
  contents: read

jobs:
  check:
    name: lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Pure functions only — the admin form helpers and the media-key
      # mapping. Everything needing a binding is covered by the smoke test in
      # the other job. Verified to reject: a failing assertion exits 1, and so
      # does a run that collects no test files, so this cannot pass vacuously.
      - run: pnpm test

      - name: Build
        run: pnpm build

      # The highest-value assertion here. A route that reads D1 must be
      # dynamic: getCloudflareContext resolves to *local* bindings during
      # static generation, so a prerendered data route bakes whatever database
      # the build machine had into the deployed output. Nothing surfaces that
      # until production serves empty data — every route still returns 200.
      #
      # This reads the build manifests rather than grepping the route table.
      # The previous version matched
      #   ^[├└┌│][^/]*ƒ ${route}$
      # for three literal paths, and could not be extended to the rest without
      # breaking: `/projects/[slug]` puts `[slug]` into an extended regex as a
      # character class, so `ƒ /projects/s` would satisfy it. It now covers
      # every D1-backed route, and a new one that is not guarded fails the job.
      #
      # Negative-tested: with force-dynamic removed from
      # src/app/projects/page.tsx the build succeeds and this step rejects.
      - name: Assert D1 routes are dynamic
        run: node scripts/check-dynamic-routes.mjs

  worker:
    name: workerd smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bundles for workerd. This is where Workers-only failures appear —
      # `next build` compiles code that the runtime then refuses to execute.
      - name: Build worker
        run: pnpm exec opennextjs-cloudflare build

      # Local D1 needs no Cloudflare credentials. Without the schema every
      # data route 500s with "no such table: projects", so this is not
      # optional setup.
      - name: Set up local D1
        run: |
          pnpm exec wrangler d1 migrations apply codewithshayy --local
          pnpm exec wrangler d1 execute codewithshayy --local --file seeds/ci.sql

      - name: Smoke test
        run: ./scripts/smoke.sh 8788
