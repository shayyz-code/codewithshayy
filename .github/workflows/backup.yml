name: Backup

# The site's content — every project, every write-up, the hero copy, the bio,
# the contact block — lives only in production D1. This is the second copy.
#
# Writes to a separate bucket rather than back into the repo, so CI keeps
# `contents: read`: the dumps hold the same contact details the admin edits,
# and git history is the wrong place for them.
on:
  schedule:
    # 03:20 UTC. Off the hour because GitHub's scheduler queues heavily there.
    - cron: "20 3 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: dump D1 and R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unlike the CI workflow, this one genuinely needs credentials: local
      # D1 and miniflare cannot stand in for the production database.
      # The token needs D1 read plus R2 read on codewithshayy-media and R2
      # write on codewithshayy-backups, and nothing else.
      - name: Dump
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          ./scripts/backup.sh --out backups/nightly

      # One archive per day rather than per file: the media set is many small
      # objects, and `r2 object put` is one request each.
      - name: Upload to codewithshayy-backups
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -czf "$STAMP.tar.gz" -C backups/nightly .
          pnpm exec wrangler r2 object put \
            "codewithshayy-backups/$STAMP.tar.gz" \
            --file "$STAMP.tar.gz" --remote \
            --content-type application/gzip

      # The upload command exiting 0 is a status code, not verification — the
      # same reason release-verify exists. Read the object back and check it
      # is the size that was just written.
      - name: Verify the object landed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler r2 object get \
            "codewithshayy-backups/$STAMP.tar.gz" \
            --file readback.tar.gz --remote
          sent=$(wc -c < "$STAMP.tar.gz")
          got=$(wc -c < readback.tar.gz)
          if [ "$sent" != "$got" ]; then
            echo "::error::wrote $sent bytes, read back $got"
            exit 1
          fi
          tar -tzf readback.tar.gz > /dev/null
          echo "$STAMP.tar.gz verified: $got bytes, archive readable"
