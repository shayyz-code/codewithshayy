allowBuilds:
  # esbuild + workerd link platform-specific binaries in postinstall; workerd
  # is what `pnpm preview` runs the worker under. Left unapproved, a fresh
  # clone gets a missing binary rather than a clear error.
  esbuild: true
  workerd: true
  sharp: true
  unrs-resolver: true

# Patched transitive versions. Every advisory `pnpm audit` reports is in build
# tooling — glob, minimatch, postcss, eslint — and none of it executes inside
# the deployed worker. Pinned anyway so a real advisory is not lost in the
# noise on a public repo.
#
# Each key is scoped to a major, because several of these have two live patch
# lines. A flat "latest" would force js-yaml 5 on eslint and nanoid 6 on
# postcss, both of which expect an older major.
overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  postcss: ^8.5.23
  nanoid@3: ^3.3.18
  js-yaml@4: ^4.3.1
  flatted: ^3.4.2
